<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Coin Toss</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;900&display=swap" rel="stylesheet">
  <style>
    body{font-family:'Inter',system-ui,Segoe UI,Roboto,sans-serif;margin:0;background:#fbfbfb}
    .perspective{perspective:1200px}
    .preserve-3d{transform-style:preserve-3d}
    .backface-hidden{backface-visibility:hidden}
    .rotate-y-180{transform:rotateY(180deg)}
    .cubic-bezier{transition-timing-function:cubic-bezier(0.15,0,0.15,1)}
    .animate-fade-in{animation:fade .5s ease-out forwards}
    @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}

    /* coin jump: translate on the coin wrapper only (no layout shift) */
    @keyframes coin-jump {0%{transform:translateY(0)}35%{transform:translateY(-34px)}70%{transform:translateY(0)}100%{transform:translateY(0)}}
    .jump{animation:coin-jump 900ms cubic-bezier(0.15,0,0.15,1) forwards}

    /* shadow pulse */
    @keyframes shadow-pulse {0%{transform:scale(1);opacity:.7}35%{transform:scale(.8);opacity:.4}70%{transform:scale(1);opacity:.7}100%{transform:scale(1);opacity:.7}}
    .shadow-anim{animation:shadow-pulse 900ms cubic-bezier(0.15,0,0.15,1) forwards}

    /* small adjustments */
    .title-gap { margin-bottom: 4px; }            /* reduced gap under title (was 6px) */
    .result-offset { transform: translate(-50%, 12px); }
  </style>
</head>
<body>
  <div id="app" class="min-h-screen flex flex-col items-center justify-start pt-8 pb-4 px-6 select-none bg-[#FBFBFB]">
    <header class="w-full text-center">
      <h1 class="text-3xl tracking-[0.2em] text-gray-400 font-black title-gap">Coin Toss</h1>
    </header>

    <main id="main" class="w-full flex items-center justify-center mt-2">
      <div class="flex flex-col items-center">
        <!-- shadow in normal flow under coin -->
        <div id="shadow" class="w-64 h-10 rounded-full bg-black/15 blur-2xl" style="opacity:.7; transition:opacity .2s, transform .2s;"></div>

        <!-- coin wrapper; jump applied here so coin visually moves up while result sits below -->
        <div id="coinWrap" class="relative mt-10" style="width:300px;height:300px;">
          <div id="coin" class="perspective w-full h-full preserve-3d cubic-bezier" style="transition:transform 2.5s cubic-bezier(.15,0,.15,1);">
            <div class="absolute inset-0 w-full h-full rounded-full border border-gray-200/50 flex items-center justify-center backface-hidden shadow-sm"
                 style="background:linear-gradient(135deg,#fff8e0,#ededed);">
              <span class="text-gray-500/40 font-semibold text-3xl tracking-[0.2em] mt-2">Heads</span>
            </div>
            <div class="absolute inset-0 w-full h-full rounded-full border border-gray-200/50 flex items-center justify-center backface-hidden rotate-y-180 shadow-sm"
                 style="background:linear-gradient(135deg,#fff8e0,#ededed);">
              <span class="text-gray-500/40 font-semibold text-3xl tracking-[0.2em] mt-2">Tails</span>
            </div>
          </div>

          <!-- result positioned below coin center (absolute, doesn't push layout).
               Using .result-offset to nudge 10px right and slightly down (24px). -->
          <div id="result"
               class="absolute left-1/2 top-full pointer-events-none text-center"
               style="width:100%; transform: translate(calc(-50% + 10px), 24px);"
               aria-hidden="true"></div>
        </div>
      </div>
    </main>

    <footer class="w-full text-center py-8 flex flex-col gap-1 mt-auto">
      <p class="text-sm text-zinc-400">Made with ❤️...... But mostly 🧠</p>
      <a href="#" class="text-sm text-zinc-500 hover:text-zinc-900 hover:underline">www.PrithviSharma.com</a>
    </footer>
  </div>

  <script>
    const coin = document.getElementById('coin');
    const coinWrap = document.getElementById('coinWrap');
    const shadow = document.getElementById('shadow');
    const resultEl = document.getElementById('result');
    let isFlipping = false;
    let rotation = 0;

    document.getElementById('main').addEventListener('click', () => {
      if (isFlipping) return;
      isFlipping = true;
      resultEl.innerHTML = ''; // clear previous

      // restart animations
      coinWrap.classList.remove('jump');
      shadow.classList.remove('shadow-anim');
      void coinWrap.offsetWidth; // force reflow to restart animation
      coinWrap.classList.add('jump');
      shadow.classList.add('shadow-anim');

      const flipResult = Math.random() > 0.5 ? 'HEADS' : 'TAILS';
      const spins = 12 + Math.floor(Math.random() * 4);
      const base = spins * 360;
      const adjust = flipResult === 'HEADS' ? 0 : 180;
      const norm = ((rotation % 360) + 360) % 360;
      rotation = rotation + (360 - norm) + base + adjust;

      coin.style.transform = 'rotateY(' + rotation + 'deg)';

      setTimeout(() => {
        isFlipping = false;
        resultEl.innerHTML = '<h2 class="text-6xl font-bold text-gray-700/40 uppercase tracking-[0.25em] animate-fade-in">' + flipResult + '</h2>';
      }, 2500);
    });
  </script>
</body>
</html>
