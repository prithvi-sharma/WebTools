<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Coin Toss</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;900&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: 'Inter', system-ui, sans-serif;
      background: #fbfbfb;
    }

    .perspective { perspective: 1200px }
    .preserve-3d { transform-style: preserve-3d }
    .backface-hidden { backface-visibility: hidden }
    .rotate-y-180 { transform: rotateY(180deg) }

    .cubic-bezier {
      transition-timing-function: cubic-bezier(0.15,0,0.15,1);
    }

    @keyframes fade {
      from { opacity: 0; transform: translateY(6px) }
      to { opacity: 1; transform: translateY(0) }
    }
    .animate-fade-in {
      animation: fade .5s ease-out forwards;
    }

    @keyframes coin-jump {
      0% { transform: translateY(0) }
      35% { transform: translateY(-34px) }
      70% { transform: translateY(0) }
      100% { transform: translateY(0) }
    }
    .jump {
      animation: coin-jump 900ms cubic-bezier(0.15,0,0.15,1) forwards;
    }

    @keyframes shadow-pulse {
      0% { transform: scale(1); opacity: .7 }
      35% { transform: scale(.8); opacity: .4 }
      70% { transform: scale(1); opacity: .7 }
      100% { transform: scale(1); opacity: .7 }
    }
    .shadow-anim {
      animation: shadow-pulse 900ms cubic-bezier(0.15,0,0.15,1) forwards;
    }
  </style>
</head>

<body>
  <div class="min-h-screen flex flex-col items-center px-4 py-6">

    <header class="text-center mb-6">
      <h1 class="text-3xl tracking-[0.25em] text-gray-400 font-black">
        Coin Toss
      </h1>
    </header>

    <main
      id="main"
      class="flex flex-col items-center justify-start flex-grow w-full pt-12 cursor-pointer"
    >
      <div class="relative flex flex-col items-center justify-center">

        <div
          id="shadow"
          class="h-10 rounded-full bg-black/15 blur-2xl mb-4"
          style="width: clamp(280px, 82vw, 440px);">
        </div>

        <div
          id="coinWrap"
          class="relative flex items-center justify-center"
          style="width: clamp(280px, 82vw, 440px); aspect-ratio: 1 / 1;"
          role="button"
          aria-label="Flip Coin"
        >
          <div
            id="coin"
            class="w-full h-full perspective preserve-3d cubic-bezier"
            style="transition: transform 2.5s cubic-bezier(.15,0,.15,1);"
          >
            <div
              class="absolute inset-0 rounded-full border border-gray-200/50 flex items-center justify-center backface-hidden shadow-sm"
              style="background: linear-gradient(135deg,#fff8e0,#ededed);"
            >
              <span class="text-gray-500/40 font-semibold text-3xl tracking-[0.2em]">
                Heads
              </span>
            </div>

            <div
              class="absolute inset-0 rounded-full border border-gray-200/50 flex items-center justify-center backface-hidden rotate-y-180 shadow-sm"
              style="background: linear-gradient(135deg,#fff8e0,#ededed);"
            >
              <span class="text-gray-500/40 font-semibold text-3xl tracking-[0.2em]">
                Tails
              </span>
            </div>
          </div>
        </div>

		<!-- Result Slot -->
		<div class="h-[5.5rem] mt-6 flex items-center justify-center">
		  <div
			id="result"
			class="font-bold text-5xl text-gray-700/40 uppercase animate-fade-in
				   grid grid-flow-col auto-cols-[1ch] gap-[0.25em] place-items-center"
		  ></div>
		</div>

      </div>
    </main>

    <footer class="text-center text-xs text-zinc-400 mt-8">
      <p>Made with ❤️...... But mostly 🧠</p>
      <a href="#" class="text-zinc-500 hover:text-zinc-900 hover:underline">
        www.PrithviSharma.com
      </a>
    </footer>
  </div>

<script>
  const coin = document.getElementById('coin');
  const coinWrap = document.getElementById('coinWrap');
  const shadow = document.getElementById('shadow');
  const resultEl = document.getElementById('result');

  let isFlipping = false;

  // probabilistic state
  let totalFlips = 0;
  let headsCount = 0;
  let tailsCount = 0;

  // initial random face
  let rotation = Math.random() > 0.5 ? 0 : 180;
  coin.style.transform = `rotateY(${rotation}deg)`;

  function probabilisticFlip() {
    totalFlips++;

    const expectedHeads = totalFlips / 2;
    const bias = headsCount - expectedHeads;

    // soft correction (prevents long streaks but keeps randomness)
    const correction = Math.max(-0.12, Math.min(0.12, -bias / totalFlips));
    const probabilityHeads = 0.5 + correction;

    const result = Math.random() < probabilityHeads ? 'HEADS' : 'TAILS';

    if (result === 'HEADS') headsCount++;
    else tailsCount++;

    return result;
  }

	document.getElementById('main').addEventListener('click', () => {
	  if (isFlipping) return;
	  isFlipping = true;

	  resultEl.innerHTML = '';

	  coinWrap.classList.remove('jump');
	  shadow.classList.remove('shadow-anim');
	  void coinWrap.offsetWidth;
	  coinWrap.classList.add('jump');
	  shadow.classList.add('shadow-anim');

	  // single source of truth
	  const flipResult = probabilisticFlip();

	  const spins = 12 + Math.floor(Math.random() * 4);
	  const base = spins * 360;
	  const direction = Math.random() > 0.5 ? 1 : -1;

	  const targetFace = flipResult === 'HEADS' ? 0 : 180;

	  const normalized = ((rotation % 360) + 360) % 360;
	  rotation += direction * (base + (targetFace - normalized));

	  coin.style.transform = `rotateY(${rotation}deg)`;

	  setTimeout(() => {
		isFlipping = false;

		resultEl.innerHTML = `
		  <div class="grid grid-flow-col auto-cols-[1ch] gap-[0.25em] place-items-center animate-fade-in">
			${flipResult
			  .split('')
			  .map(
				(char) =>
				  `<span class="inline-block w-[1ch] text-center text-5xl font-bold text-gray-700/40 uppercase">${char}</span>`
			  )
			  .join('')}
		  </div>
		`;
	  }, 2500);
	});
</script>
</body>
</html>
